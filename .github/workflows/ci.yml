name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: catch behaviour drift in the pinned SDKs' environment

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit + controls (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install harness (stdlib only) and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Strict type check
        run: pyright
      - name: Keyless tests (no SDKs)
        run: pytest -m "not sdk" --cov=mcp_faultline --cov-report=term-missing
      - name: Harness self-test (all mutants and faults must be detected)
        run: faultline controls

  sdk:
    name: FL-001 against pinned official SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install harness and pinned Python SDK
        run: python -m pip install -e ".[targets,dev]"
      - name: Install pinned TypeScript SDKs (lockfiles)
        run: |
          node --version
          npm ci --prefix targets/ts
          npm ci --prefix targets/ts-v2
      - name: Show targets (detected vs pinned versions)
        run: faultline targets
      - name: SDK characterisation tests
        run: pytest -m sdk -rx
      - name: Full FL-001 matrix
        run: faultline run FL-001 -o runs/ci
      - name: Upload results and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fl001-results
          path: runs/ci
          retention-days: 30

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit pinned Python SDK
        run: |
          python -m pip install pip-audit
          pip-audit --requirement <(echo "mcp==2.3.0")
      - name: Audit TypeScript fixtures
        run: |
          npm audit --prefix targets/ts --omit=dev --audit-level=high
          npm audit --prefix targets/ts-v2 --omit=dev --audit-level=high
