version: 2
updates:
  # SDK bumps change the system under test: review them with a fresh FL-001 run,
  # update PINNED in src/mcp_faultline/targets.py, and regenerate evidence/.
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/targets/ts"
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/targets/ts-v2"
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
